<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kemudi.id — Simulasi Mengemudi</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0b1220; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        #unity-container { position: fixed; inset: 0; background: #0b1220; }
        #unity-canvas { width: 100%; height: 100%; display: block; background: #0b1220; }
        #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 80vw); text-align: center; }
        #unity-progress-bar-empty { height: 10px; border-radius: 999px; background: #1e293b; overflow: hidden; border: 1px solid #334155; }
        #unity-progress-bar-full { width: 0%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #2563eb, #38bdf8); transition: width 0.2s ease; }
        #unity-title { color: #e2e8f0; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: 0.02em; }
        #unity-title span { color: #38bdf8; }
        #unity-status { color: #94a3b8; font-size: 0.85rem; margin-top: 0.75rem; }
        #unity-warning { color: #fbbf24; font-size: 0.8rem; margin-top: 0.5rem; display: none; }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-title">Kemudi<span>.id</span> — Simulasi 3D</div>
            <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
            <div id="unity-status">Memuat aplikasi simulasi…</div>
            <div id="unity-warning"></div>
        </div>
    </div>

    <script>
        // Token & pilihan kendaraan dari launcher Blazor (/simulasi?token=...&vehicle=...).
        var _params = new URLSearchParams(window.location.search);
        window.kemudiAuthToken = _params.get('token') || '';
        window.kemudiVehicleType = _params.get('vehicle') || '';

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/{{ LOADER_FILENAME }}";
        var config = {
            dataUrl: buildUrl + "/{{ DATA_FILENAME }}",
            frameworkUrl: buildUrl + "/{{ FRAMEWORK_FILENAME }}",
            codeUrl: buildUrl + "/{{ CODE_FILENAME }}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Kemudi.id",
            productName: "Kemudi.Simulation",
            productVersion: "1.0",
            showBanner: function (el) {
                var warning = document.querySelector("#unity-warning");
                warning.style.display = "block";
                warning.textContent = "Browser versi lama terdeteksi — gunakan Chrome/Edge terbaru.";
            }
        };

        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var status = document.querySelector("#unity-status");

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
            createUnityInstance(canvas, config, function (progress) {
                progressBarFull.style.width = (100 * progress) + "%";
                if (progress > 0) status.textContent = "Memuat… " + Math.round(progress * 100) + "%";
            }).then(function (unityInstance) {
                loadingBar.style.display = "none";
            }).catch(function (message) {
                status.textContent = "Gagal memuat simulasi: " + message;
            });
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
